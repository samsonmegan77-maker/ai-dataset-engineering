services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes: [./apps/web:/app, web-node-modules:/app/node_modules]
  api:
    build: .
    command: uvicorn dataset_api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////data/dataset_engineering.db
      CORS_ORIGINS: http://localhost:5173
      MAX_UPLOAD_BYTES: 10485760
      MAX_RECORDS: 100000
    ports: ["8000:8000"]
    volumes: [dataset-data:/data]
volumes:
  web-node-modules:
  dataset-data:
