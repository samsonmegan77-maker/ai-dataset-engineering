name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Normalize application source
        run: |
          ruff format src
          ruff check src --fix
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Apply Ruff formatting and safe lint fixes"
            git push
          fi
      - name: Ruff
        run: ruff check src
      - name: Format check
        run: ruff format --check src
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Bandit
        run: bandit -r src
      - name: Dependency audit
        run: pip-audit
