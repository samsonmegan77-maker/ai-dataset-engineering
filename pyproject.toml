[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-dataset-engineering"
version = "1.0.0"
description = "A standalone toolkit for preparing, validating, profiling, and auditing AI/ML datasets."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "AI Dataset Engineering contributors"}]
dependencies = ["pydantic>=2.8,<3", "typer>=0.12,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "hypothesis>=6.110,<7", "bandit>=1.7,<2", "pip-audit>=2.7,<3", "httpx>=0.27,<1"]
postgres = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
[project.scripts]
dataset = "dataset_engineering.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/dataset_engineering"]
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "apps/api"]
[tool.coverage.run]
branch = true
source = ["dataset_engineering"]
[tool.coverage.report]
fail_under = 80
show_missing = true
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
[tool.bandit]
exclude_dirs = ["tests"]
